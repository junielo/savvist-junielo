<div
  ngCombobox
  #combobox="ngCombobox"
  [expanded]="disabled() ? false : popupExpanded()"
  (expandedChange)="!disabled() && popupExpanded.set($event)"
  [preserveContent]="true"
  class="select"
  [aria-disabled]="disabled()"
  [style.width]="width()"
>
  <span class="combobox-label">
    @if (displayIcon()) {
      <span
        class="selected-label-icon material-symbols-outlined"
        translate="no"
        aria-hidden="true"
        >{{ displayIcon() }}</span
      >
    }
    <span class="selected-label-text">{{ displayValue() | titlecase }}</span>
  </span>
  <span class="example-arrow material-symbols-outlined" translate="no" aria-hidden="true"
    >arrow_drop_down</span
  >
</div>

<ng-template
  [cdkConnectedOverlay]="{ origin: combobox.element, usePopover: 'inline', matchWidth: true }"
  [cdkConnectedOverlayOpen]="popupExpanded()"
>
  <ng-template ngComboboxPopup [combobox]="combobox">
    <div class="example-popup-container">
      <div
        #listbox="ngListbox"
        ngListbox
        ngComboboxWidget
        [tabindex]="-1"
        focusMode="activedescendant"
        selectionMode="explicit"
        [value]="selectedValues()"
        (valueChange)="onValueChange($event)"
        [activeDescendant]="listbox.activeDescendant()"
        (click)="onCommit()"
        (keydown.enter)="onCommit()"
        (keydown.space)="onCommit()"
      >
        @for (option of normalizedOptions(); track option.value) {
          <div ngOption [value]="option.value" [label]="option.value">
            @if (option.icon) {
              <span
                class="example-option-icon material-symbols-outlined"
                translate="no"
                aria-hidden="true"
                >{{ option.icon }}</span
              >
            }
            <span class="example-option-text">{{ option.value | titlecase }}</span>
            <span
              class="example-option-check material-symbols-outlined"
              translate="no"
              aria-hidden="true"
              >check</span
            >
          </div>
        }
      </div>
    </div>
  </ng-template>
</ng-template>
