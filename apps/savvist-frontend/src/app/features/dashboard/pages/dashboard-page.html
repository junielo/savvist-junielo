<div class="dashboard-container">
  <div class="dashboard-header">
    @if (user(); as u) {
      <span class="user-name">Welcome back, {{ u.displayName }}</span>
    }
  </div>

  @if (summaryError()) {
    <div class="error-message" role="alert" style="color: red; margin-bottom: 12px; font-size: 14px;">
      Failed to load dashboard summary.
    </div>
  }

  <!-- Row 1: Three card-computed-amount in a single row -->
  <div class="cards-row">
    <app-card-computed-amount
      [amount]="summary()?.totalFund ?? 0"
      [subText]="'Total Fund'"
      [height]="'180px'"
    />
    <app-card-computed-amount
      [amount]="summary()?.actualCash ?? 0"
      [subText]="'Actual Cash'"
      [height]="'180px'"
    />
    <app-card-computed-amount
      [amount]="todaysAllowance()?.allowance ?? 0"
      [subText]="'Today\'s Allowance'"
      [height]="'180px'"
    />
  </div>

  <!-- Row 2: Two apex-gauge-label in the next row -->
  <div class="gauges-row">
    <div class="gauge-card">
      <app-apex-gauge-label
        [value]="(summary()?.health ?? 0) * 100"
        [label]="'Financial Health'"
        [height]="300"
      />
    </div>
    <div class="gauge-card">
      <app-apex-gauge-label
        [value]="(summary()?.growth ?? 0) * 100"
        [label]="'Growth Rate'"
        [height]="300"
      />
    </div>
  </div>
</div>
