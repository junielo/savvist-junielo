<div class="dialog-header">
  <h2 mat-dialog-title class="dialog-title">{{ isEdit ? 'Update Expense' : 'Add Expense' }}</h2>
  <button
    type="button"
    matIconButton
    (click)="close()"
    aria-label="Close dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  @if (errorMessage()) {
    <div class="error-message" style="color: red; margin-bottom: 12px; font-size: 14px;">
      {{ errorMessage() }}
    </div>
  }
  <form [formGroup]="expenseForm" class="expense-form">
    <!-- Expense Name field (full width) -->
    <mat-form-field appearance="fill" class="full-width-field">
      <mat-label>Expense Name</mat-label>
      <input matInput type="text" formControlName="name" placeholder="Expense Name" />
    </mat-form-field>

    <!-- Amount and Date row (two equal columns, 32px gap) -->
    <div class="amount-date-row">
      <mat-form-field appearance="fill" class="field-col">
        <mat-label>Expense Amount</mat-label>
        <input matInput type="number" formControlName="amount" placeholder="Expense Amount" />
      </mat-form-field>

      <div class="field-col">
        <app-aria-select
          class="date-select"
          [options]="dateOptions"
          [placeholder]="'Select Date'"
          [value]="expenseForm.controls.date.value ?? ''"
          (valueChange)="expenseForm.controls.date.setValue($event)"
        />
      </div>
    </div>

    <!-- Month chips section -->
    <div class="chips-wrapper">
      <mat-chip-listbox [multiple]="true" [formControl]="expenseForm.controls.months" class="month-chip-listbox">
        @for (month of monthsList; track month.id) {
          <mat-chip-option [value]="month.id">{{ month.name }}</mat-chip-option>
        }
      </mat-chip-listbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button type="button" matButton class="rounded-button" (click)="close()">Cancel</button>
  <button type="button" matButton="filled" class="rounded-button" [disabled]="isSaving()" (click)="save()">{{ isSaving() ? 'Saving...' : 'Save' }}</button>
</mat-dialog-actions>
