<div class="dialog-header">
  <h2 mat-dialog-title class="dialog-title">Add Entry</h2>
  <button
    type="button"
    matIconButton
    (click)="close()"
    aria-label="Close dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <!-- Content is empty for now -->
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button type="button" matButton class="rounded-button">Cancel</button>
  <button type="button" matButton="filled" class="rounded-button">Save</button>
</mat-dialog-actions>
