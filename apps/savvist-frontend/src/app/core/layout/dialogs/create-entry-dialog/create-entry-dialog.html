<div class="dialog-header">
  <h2 mat-dialog-title class="dialog-title">Add Entry</h2>
  <button
    type="button"
    matIconButton
    (click)="close()"
    aria-label="Close dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="entryForm" class="dialog-form">
    <mat-form-field class="example-form-field centered-field">
      <mat-label>Entry date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    @for (entry of entries(); track entry.id) {
      <div class="entry-row">
        <mat-form-field class="example-form-field">
          <mat-label>{{ entry.type | titlecase }} · {{ entry.name }}</mat-label>
          <input
            matInput
            type="number"
            [readonly]="isLoadingRecords()"
            [ngModel]="balances()[entry.id] ?? null"
            (ngModelChange)="onBalanceInput(entry.id, $event)"
            [ngModelOptions]="{standalone: true}"
          />
        </mat-form-field>
        <button
          type="button"
          matIconButton
          (click)="editEntry(entry)"
          aria-label="Edit entry"
          class="action-button"
        >
          <mat-icon style="font-size: 18px;">edit</mat-icon>
        </button>
        <button
          type="button"
          matIconButton
          (click)="deleteEntry(entry.id)"
          aria-label="Delete entry"
          class="action-button"
        >
          <mat-icon style="font-size: 18px; color: rgb(255, 77, 77);">delete</mat-icon>
        </button>
      </div>
    }

  </form>
  <div class="create-new-entry-container">
    <a
      role="button"
      tabindex="0"
      (click)="openNewEntryDialog()"
      (keydown.enter)="openNewEntryDialog()"
      class="create-new-entry-link"
    >
      Create New Entry
    </a>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button type="button" matButton="filled" class="rounded-button" (click)="close()">Cancel</button>
  <button type="button" matButton="filled" class="rounded-button" (click)="close()">Save</button>
</mat-dialog-actions>
