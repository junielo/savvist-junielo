<div class="main-container">
  <div class="center-container">
    <header>
      <button matButton="elevated">
        <mat-icon>add</mat-icon>
        Add New Wishlist
      </button>
    </header>
    <section>
      @for (item of itemData; track $index) {
        <app-wishlist-list-item [itemData]="item"/>
      }
    </section>
    <footer>
      <mat-divider class="custom-thick-divider"/>
      <div class="footer-detail">
        <span>Total Expense/Month</span>
        <span>PHP 10,000.00</span>
      </div>
    </footer>
  </div>
</div>
