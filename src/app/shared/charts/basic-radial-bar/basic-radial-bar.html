<svg
  [attr.width]="width()"
  [attr.height]="height()"
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  role="progressbar"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="progress()"
  [attr.aria-label]="label() || null"
>
  <circle
    class="track"
    [attr.cx]="centerX()"
    [attr.cy]="centerY()"
    [attr.r]="radius()"
    [style.stroke]="trackColor()"
    [style.stroke-width.px]="thickness()"
  />
  <circle
    class="bar"
    [attr.cx]="centerX()"
    [attr.cy]="centerY()"
    [attr.r]="radius()"
    [attr.transform]="'rotate(-90 ' + centerX() + ' ' + centerY() + ')'"
    [attr.visibility]="progress() === 0 ? 'hidden' : 'visible'"
    [style.stroke]="color()"
    [style.stroke-width.px]="thickness()"
    [style.stroke-dasharray.px]="circumference()"
    [style.stroke-dashoffset.px]="dashOffset()"
  />
</svg>
